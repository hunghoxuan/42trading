upstream api {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name trade.mozasolution.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trade.mozasolution.com;

    ssl_certificate /etc/ssl/certs/trade.mozasolution.com.pem;
    ssl_certificate_key /etc/ssl/private/trade.mozasolution.com.key;

    root /opt/trading/web-ui/dist;
    index index.html;

    # API proxy — pass to webhook backend
    location /auth/       { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /health      { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /mt5/        { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /v2/         { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /sse/        { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
    location /system/     { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /webhook/    { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    # Static UI files
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
