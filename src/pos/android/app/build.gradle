plugins { id 'com.android.application' }

def posUrl = providers.gradleProperty('posUrl').orElse('https://hunghx.tail02c7f8.ts.net:8443/admin/pos').get()
def parsedUrl = new URI(posUrl)
if (parsedUrl.scheme != 'https' || !parsedUrl.host || parsedUrl.userInfo || parsedUrl.fragment) {
    throw new GradleException('posUrl must be an HTTPS URL without credentials or a fragment')
}

def signingPath = System.getenv('POS_ANDROID_KEYSTORE')
android {
    namespace 'com.mozasolution.pos'
    compileSdk 36
    defaultConfig {
        applicationId 'com.mozasolution.pos'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
        buildConfigField 'String', 'POS_URL', groovy.json.JsonOutput.toJson(posUrl)
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (signingPath) {
        signingConfigs {
            release {
                storeFile file(signingPath)
                storePassword System.getenv('POS_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('POS_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('POS_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingPath) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError true }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
}
