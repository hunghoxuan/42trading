<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark light" />
        <meta name="theme-color" content="#0b0f14" />
        <title>PayHub</title>
        <link rel="icon" type="image/png" href="/logo/payhub-p-final.png" />
        <link rel="shortcut icon" href="/logo/payhub-p-final.png" />
        <script>
            // Apply the theme before the app paints. Legacy/default sessions are
            // migrated to dark; only an explicit theme selection is persisted.
            (function () {
                var theme = "dark";
                try {
                    var userSelected =
                        localStorage.getItem("ui_theme_user_selected") === "1";
                    if (
                        userSelected &&
                        localStorage.getItem("ui_theme") === "light"
                    ) {
                        theme = "light";
                    }
                } catch (_) {
                    theme = "dark";
                }
                document.documentElement.setAttribute("data-theme", theme);
                document.documentElement.style.colorScheme = theme;
                document
                    .querySelector('meta[name="theme-color"]')
                    .setAttribute(
                        "content",
                        theme === "light" ? "#e6edf5" : "#0b0f14",
                    );
            })();

            // Guard against broken browser extensions that monkey-patch JS built-ins.
            // Save originals and restore them before app modules execute.
            (function () {
                var devtoolsBanner =
                    "Download the React DevTools for a better development experience";
                var originalInfo = console.info;
                console.info = function () {
                    var firstArg = String(arguments[0] || "");
                    if (firstArg.includes(devtoolsBanner)) return;
                    return originalInfo.apply(console, arguments);
                };
                var _apply = Reflect.apply.bind(Reflect);
                var _toString = Function.prototype.toString;
                var _defProp = Object.defineProperty;
                // Re-arm: restore originals right before the module script runs
                var observer = new MutationObserver(function () {
                    if (Function.prototype.toString !== _toString) {
                        Function.prototype.toString = _toString;
                    }
                    if (Reflect.apply !== _apply) {
                        Reflect.apply = _apply;
                    }
                });
                observer.observe(document.documentElement, {
                    childList: true,
                    subtree: true,
                });
                // Also catch unhandled errors from extensions silently
                window.addEventListener(
                    "error",
                    function (e) {
                        if (e.filename && e.filename.includes("edreader")) {
                            e.preventDefault();
                            return false;
                        }
                    },
                    true,
                );
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/app/main.jsx"></script>

    </body>
</html>
