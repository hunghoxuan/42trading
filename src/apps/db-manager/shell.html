<section class="dbm-page-shell trades-page-container stack-layout fadeIn">
  <div class="page-header trades-page-header">
    <div class="page-header__title">
      <h1 class="page-title">DB Manager</h1>
    </div>
    <div class="page-header__actions dbm-page-header-actions">
      <div class="dbm-header-controls">
        <select id="connection" class="dbm-control"></select>
        <button id="refreshTables" class="secondary-button dbm-button" type="button">Refresh</button>
        <button id="toggleSqlMode" class="secondary-button dbm-button" type="button">SQL</button>
        <input id="rowSearch" class="dbm-control" placeholder="SEARCH RECORDS..." />
        <textarea id="inlineSqlEditor" class="dbm-control dbm-sql-editor" style="display:none;resize:none" placeholder="SELECT ..." spellcheck="false"></textarea>
        <button id="runInlineSql" class="primary-button dbm-button" type="button" style="display:none">Run</button>
      </div>
      <span id="headerStatus" class="dbm-status-line minor-text"></span>
        <span id="tableInfo" class="dbm-inline-status minor-text"></span>
    </div>
  </div>

  <div id="syncStatus" class="dbm-sync-status hidden">
    <div id="syncProgress" class="dbm-sync-progress" aria-hidden="true"></div>
    <span id="syncStatusText"></span>
  </div>

  <div class="logs-layout-split dbm-layout-split">
    <aside class="logs-list-pane dbm-sidebar-pane" id="tables">
      <div class="dbm-sidebar-header">
        <div class="panel-label">Tables</div>
        <div class="minor-text" id="tableCount"></div>
      </div>
      <div class="dbm-sidebar-search">
        <input id="tableSearch" class="dbm-control" style="width:100%;min-width:0" placeholder="SEARCH TABLES..." />
      </div>
      <ul id="tableList" class="dbm-table-list"></ul>
    </aside>

    <section class="dbm-main stack-layout">
      <div class="dbm-pane-grid">
        <section class="panel dbm-content-panel" id="rows">
          <div class="dbm-panel-head">
            <div class="panel-label" id="rowsTitle">Rows</div>
            <div class="dbm-panel-actions">
              <button id="viewSchemaBtn" class="secondary-button dbm-button dbm-button--compact" type="button">View Schema</button>
              <select id="pageSize" class="dbm-control dbm-control--compact">
                <option value="25">25</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
                <option value="200">200</option>
              </select>
              <div class="dbm-pagination">
                <button id="pageFirst" class="secondary-button dbm-button dbm-button--compact" type="button">&laquo;</button>
                <button id="pagePrev" class="secondary-button dbm-button dbm-button--compact" type="button">&lsaquo;</button>
                <span id="pageIndicator" class="dbm-page-indicator minor-text">0 / 0</span>
                <button id="pageNext" class="secondary-button dbm-button dbm-button--compact" type="button">&rsaquo;</button>
                <button id="pageLast" class="secondary-button dbm-button dbm-button--compact" type="button">&raquo;</button>
              </div>
              <span id="totalIndicator" class="dbm-inline-status minor-text"></span>
              <span id="rowsStatus" class="minor-text"></span>
            </div>
          </div>
          <div id="rowsError" class="dbm-error hidden"></div>
          <div class="dbm-data-grid-wrap">
            <table class="dbm-data-grid table-dense">
              <thead>
                <tr id="tableHead"></tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </section>

        <aside class="logs-detail-pane panel dbm-detail-pane hidden" id="detailPane">
          <div class="dbm-panel-head">
            <div class="panel-label" id="detailTitle">Row</div>
            <div class="dbm-panel-actions">
              <button id="btnAddRow" class="primary-button dbm-button dbm-button--compact" type="button" title="Add new row">+ New</button>
              <button id="btnSaveRow" class="secondary-button dbm-button dbm-button--compact" type="button" title="Save changes" disabled>Save</button>
              <button id="btnCloneRow" class="secondary-button dbm-button dbm-button--compact" type="button" title="Clone selected row" disabled>Clone</button>
              <button id="btnDeleteRow" class="danger-button dbm-button dbm-button--compact" type="button" title="Delete selected row" disabled>Del</button>
              <button id="btnDeleteTable" class="danger-button dbm-button dbm-button--compact hidden" type="button" title="Delete selected table">Delete Table</button>
              <button id="showSchemaBtn" class="secondary-button dbm-button dbm-button--compact" type="button">Schema</button>
              <button id="toggleDetail" class="secondary-button dbm-button dbm-button--compact" type="button">✕</button>
            </div>
          </div>
          <div id="detail" class="dbm-detail-body">
            <div id="detailContent" class="empty-state dbm-detail-empty">Click a row to inspect its values.</div>
          </div>
        </aside>
      </div>
    </section>
  </div>
</section>
