name: Build POS Android
on:
  workflow_dispatch:
  push:
    branches: ['codex/pos-android', 'main']
    paths:
      - 'src/pos/android/**'
      - '.github/workflows/pos-android.yml'
  pull_request:
    paths:
      - 'src/pos/android/**'
      - '.github/workflows/pos-android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/pos/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 42trade-pos-debug
          path: src/pos/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
